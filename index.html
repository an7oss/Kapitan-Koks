<head>

<title>KOKOS. HISTORIA PRAWDZIWA.</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#14161a;--line:#30343b;--text:#f5f5f0;--muted:#a7abb3;--lime:#d6ff46;--orange:#ff9b54}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
#app{min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#1b2024 0,#08090b 62%);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);display:flex;justify-content:center}
.screen{width:100%;max-width:760px;min-height:100svh;display:flex;flex-direction:column}
#intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000;position:fixed;inset:0;z-index:10;padding:24px;gap:28px}
#intro .logo{margin:0;max-width:900px;color:#f7ffff;text-shadow:0 0 8px rgba(170,245,255,.95),0 0 22px rgba(95,220,255,.8),0 0 48px rgba(75,130,255,.55);letter-spacing:.025em;line-height:1.05}
#intro .primary{margin:0;min-width:220px;padding:17px 30px;border:1px solid rgba(255,255,255,.85);border-radius:16px;background:linear-gradient(135deg,#ffffff 0%,#c8f8ff 28%,#8a9dff 62%,#e8faff 100%);color:#080a14;font-weight:950;letter-spacing:.12em;box-shadow:0 0 10px rgba(255,255,255,.85),0 0 26px rgba(110,210,255,.75),0 0 55px rgba(106,116,255,.45),inset 0 2px 2px rgba(255,255,255,.95);text-shadow:0 1px 0 rgba(255,255,255,.8);transition:transform .18s,box-shadow .18s}
#intro .primary:hover{transform:translateY(-2px);box-shadow:0 0 14px rgba(255,255,255,.95),0 0 34px rgba(110,210,255,.9),0 0 68px rgba(106,116,255,.6),inset 0 2px 2px rgba(255,255,255,.95)}
#intro .primary:active{transform:scale(.97);box-shadow:0 0 8px rgba(255,255,255,.8),0 0 20px rgba(110,210,255,.7),inset 0 2px 2px rgba(255,255,255,.9)}
.kicker{letter-spacing:.28em;text-transform:uppercase;color:var(--lime);font-size:.68rem;font-weight:800}
.logo{font-size:clamp(2.1rem,9vw,5rem);line-height:.94;font-weight:1000;letter-spacing:-.065em;margin:18px 0 12px;text-wrap:balance}
.logo span{display:block;color:var(--lime)}
.subtitle{color:#aaa;font-size:.9rem;max-width:340px;line-height:1.6}
.primary{margin-top:28px;border:0;border-radius:14px;background:var(--lime);color:#111;font-weight:950;padding:16px 25px;min-width:190px;box-shadow:0 7px 0 #8ea72d;cursor:pointer}
.primary:active{transform:translateY(3px);box-shadow:0 4px 0 #8ea72d}
.intro-note{position:absolute;bottom:24px;color:#555;font-size:.7rem;letter-spacing:.12em}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 12px;border-bottom:1px solid var(--line);gap:12px}
.brand{font-size:.83rem;font-weight:1000;letter-spacing:.08em}.brand b{color:var(--lime)}
.small-button{background:#191b20;border:1px solid var(--line);color:#ddd;border-radius:10px;padding:8px 11px;font-size:.75rem;cursor:pointer}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0}
.stat{background:#111317;border:1px solid #24272d;border-radius:12px;padding:10px 12px}.stat-label{font-size:.62rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.stat-value{font-size:1.12rem;font-weight:900;margin-top:2px}
.chapter{display:flex;align-items:center;gap:9px;margin:12px 0 6px;color:var(--lime);font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.chapter:before{content:"";width:22px;height:2px;background:var(--lime)}
.scene-title{font-size:clamp(1.7rem,6vw,2.65rem);line-height:1.04;letter-spacing:-.045em;margin:8px 0 14px;font-weight:950}
.art{min-height:138px;border-radius:18px;border:1px solid #2a2d33;background:linear-gradient(135deg,#20262a,#101114 70%);display:flex;align-items:center;justify-content:center;font-size:4.6rem;position:relative;overflow:hidden;margin:8px 0 18px}
.art:after{content:"";position:absolute;inset:auto -20px -65px;height:110px;background:var(--lime);opacity:.08;transform:rotate(-8deg)}
.art.photo-art{display:block;min-height:0;height:auto;padding:0;background:#111}
.art.photo-art:after{display:none}.art.photo-art img{display:block;width:100%;height:auto;max-height:310px;object-fit:cover}
.photo-credit{font-size:.66rem;color:#8f949b;margin:-10px 0 18px}.photo-credit a{color:var(--lime)}
.story{font-size:1rem;line-height:1.75;color:#e1e2df;white-space:pre-line}.story strong{color:var(--lime)}
.dialogue{border-left:3px solid var(--orange);background:#191719;padding:13px 15px;margin:16px 0;border-radius:0 12px 12px 0;color:#f5d5bf;font-size:.93rem;line-height:1.6}
.choices{display:grid;gap:10px;margin:20px 0 28px}.choice{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:15px 14px;border:1px solid #30343a;border-radius:14px;background:#15171b;color:var(--text);cursor:pointer;transition:border-color .15s,transform .15s}.choice:hover{border-color:var(--lime)}.choice:active{transform:scale(.99)}.choice-num{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:8px;background:#292d30;color:var(--lime);font-size:.76rem;font-weight:900}.choice-copy{font-size:.9rem;line-height:1.45}.choice-copy small{display:block;color:var(--muted);margin-top:4px;font-size:.75rem}
footer{margin-top:auto;padding:18px 0 22px;color:#656970;font-size:.68rem;display:flex;justify-content:space-between;border-top:1px solid #22252a;gap:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--lime);color:#111;font-weight:850;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:20}#toast.show{opacity:1;transform:translate(-50%,0)}
.ending{border:1px solid #41472b;background:linear-gradient(145deg,#1c2113,#12140f);border-radius:18px;padding:18px;margin:18px 0}.ending h3{color:var(--lime);margin:0 0 8px}
@media(min-width:650px){#app{padding-left:28px;padding-right:28px}.art{min-height:190px;font-size:5.5rem}.story{font-size:1.05rem}}
</style>
</head>

<script>
const scenes = {
start:{chapter:"Rozdział 1 · Parking szkolny",title:"7:40. C-Max kontra Jagiellonia",art:"🚙⚽",story:"Godzina 7:40. Kokos wjeżdża Fordem C-Maxem na szkolny parking i parkuje tak krzywo, że dwa miejsca parkingowe składają skargę. Wysiada, zarzuca plecak na ramię i wtedy drogę zastępuje mu grupa kibiców Jagiellonii. Jeden puka w dach auta i zauważa barwy Legii przy breloku Kokosa. „No proszę, legionisto. Masz minutę, żeby wyjaśnić, co tu robisz”. Kokos zerka na szkołę. Nauczyciel dyżurny jest daleko, a kluczyki nadal ma w ręce.",dialogue:"KOKOS: „Panowie, to jest minivan. On nawet nie potrafi szybko wyjechać z parkingu.”",choices:[["A","Zadzwonić po pomoc do Legii",{rep:2,form:0,car:0},"Telefon zamiast samotnego bohaterstwa.","legiahelp"],["B","Spróbować ich zagadać i przeczekać",{rep:1,form:-2,car:0},"Dyplomacja parkingowa, wersja Kokosa.","stall"],["C","Oddać szalik i spróbować odejść",{rep:-1,form:-4,car:0},"To nie gwarantuje spokoju, ale próbuje uniknąć eskalacji.","colors"]]},
legiahelp:{chapter:"Rozdział 1 · Kibicowski crossover",title:"Legia, Teddy Boys 95 i Zagłębie przyjeżdżają",art:"🟢⚪🔴🚩",story:"Kokos dzwoni po pomoc. Niedługo później pojawia się ekipa Legii, a razem z nią Teddy Boys 95 i kibice Zagłębia Sosnowiec. Parking wypełnia się okrzykami i wzajemnymi wyzwiskami. Dochodzi do chaotycznego starcia, ludzie rozbiegają się między autami, a nauczyciel dyżurny wzywa służby. Po zamieszaniu ekipa Jagiellonii wycofuje się, a Legia ogłasza zwycięstwo.",dialogue:"KOKOS: „Ja chciałem tylko zaparkować, a wy robicie crossover sezonu!” NET przez telefon: „Ile flag?” KOKOS: „Skąd mam wiedzieć, jeszcze się kłócą!”",choices:[["A","Zobaczyć, o co chodzi z 58 zabranymi flagami",{rep:2,form:0,car:0},"Legia twierdzi, że przejęła 58 flag Jagiellonii.","flags"],["B","Sprawdzić, czy C-Max jest cały",{rep:1,form:2,car:0},"Kokos nie chce być statystą w kolejnym starciu.","carcheck"]]},
flags:{chapter:"Rozdział 1 · 58 flag",title:"Pięćdziesiąt osiem powodów do przypału",art:"🚩🔥",story:"Legia chwali się zdobyciem 58 flag Jagiellonii. W emocjach część ekipy urządza ich demonstracyjne spalenie na uboczu. Nagrania trafiają do sieci, a na miejsce docierają służby. Kokos orientuje się, że jego auto i twarz widać na kilku filmikach, więc ta historia może mieć konsekwencje także dla niego.",dialogue:"KOKOS: „58 flag. Ja mam 58 nieprzeczytanych wiadomości i już mnie boli głowa.” NET: „Nie wrzucaj niczego do sieci. Serio.”",choices:[["A","Posłuchać NET-a i nie publikować nagrań",{rep:2,form:1,car:0},"Nie dolewa oliwy do internetowego pożaru.","netadvice"],["B","Wrzucić relację ze swoją wersją",{rep:-2,form:-1,car:0},"Telefon zapowiada kolejny problem.","viral"]]},
netadvice:{chapter:"Rozdział 2 · Pierwsze konsekwencje",title:"NET przejmuje dowodzenie",art:"📱🧯",story:"NET mówi Kokosowi, żeby trzymał się z dala od tłumu i nie wrzucał filmików. Kokos słucha, co samo w sobie jest wydarzeniem wartym kroniki szkoły. Nauczyciel spisuje świadków, a służby ustalają, co się wydarzyło. Kokos musi zdecydować, czy opowiedzieć prawdę, czy udawać przypadkowego widza.",dialogue:"NET: „Nie jesteś rzecznikiem prasowym żadnej ekipy. Powiedz, co widziałeś, i nie zmyślaj.”",choices:[["A","Złożyć spokojną relację z tego, co widział",{rep:3,form:1,car:0},"Rozsądny wybór.","schooloffice"],["B","Zadzwonić do domu, żeby ktoś go odebrał",{rep:2,form:2,car:0},"Dzisiaj samodzielnych decyzji wystarczy.","homecall"]]},
viral:{chapter:"Rozdział 2 · Internet płonie",title:"Relacja, której nie dało się cofnąć",art:"📲💥",story:"Kokos wrzuca relację. W tle widać szkolny szyld, kilka twarzy i jego C-Maxa. Po pięciu minutach ma setki udostępnień i wiadomość od dyrektora: „Czy możemy porozmawiać?”. NET pisze tylko: „Mówiłem”. Kokos usuwa relację, ale screeny już krążą.",dialogue:"KOKOS: „Usunąłem!” NET: „Internet nie jest koszem, z którego wszystko znika.”",choices:[["A","Przyznać, że wrzucił relację bez namysłu",{rep:1,form:0,car:0},"Bierze odpowiedzialność za post.","schooloffice"],["B","Kłócić się z każdym w komentarzach",{rep:-3,form:-2,car:0},"Każda odpowiedź daje dramie nowe życie.","groupchat"]]},
stall:{chapter:"Rozdział 1 · Próba negocjacji",title:"Kokos odpala dyplomację parkingową",art:"🗣️🚙",story:"Kokos tłumaczy, że brelok z barwami to pamiątka, a nie deklaracja wojny. Napięcie rośnie, gdy zbierają się kolejni uczniowie. W końcu podchodzi nauczyciel dyżurny i każe wszystkim odsunąć się od aut.",dialogue:"NAUCZYCIEL: „To parking szkolny, nie konferencja po derbach. Wszyscy krok w tył.”",choices:[["A","Pójść z nauczycielem do szkoły",{rep:2,form:1,car:0},"Najpierw bezpieczeństwo.","schooloffice"],["B","Zadzwonić do NET-a",{rep:1,form:0,car:0},"NET szykuje wykład o krzywym parkowaniu.","netadvice"]]},
colors:{chapter:"Rozdział 1 · Nieudany układ",title:"Szalik oddany, problem nie zniknął",art:"🧣😬",story:"Kokos oddaje szalik, licząc, że to zakończy sprawę. Kibice nadal go zaczepiają, ale nauczyciel dyżurny odprowadza go do budynku. Kokos jest wściekły i zawstydzony. NET mówi mu, że nie musi udawać, że nic się nie stało.",dialogue:"NET: „Nie ma honoru w pozwalaniu komuś, żeby cię zastraszał. Zgłoś to.”",choices:[["A","Opowiedzieć nauczycielowi, co się stało",{rep:2,form:1,car:0},"Sprawa trafia do dyrekcji.","schooloffice"],["B","Zadzwonić do domu po odbiór",{rep:1,form:2,car:0},"Spokojne wyjście z tej sytuacji.","homecall"]]},
carcheck:{chapter:"Rozdział 2 · Inspekcja C-Maxa",title:"Lusterko poszło się jebać",art:"🚙🔧",story:"Kokos obchodzi C-Maxa i widzi pęknięte lusterko oraz wgniecenie na drzwiach. Patrzy na auto, potem na oddalających się Jagiellończyków. „Okej. Teraz to już osobiste”. NET zna ich trasę, więc ekipa rusza tropem rywali przez osiedle, boisko i przejście podziemne. Zaczyna się nerwowa gra w podchody: każdy skręt może oznaczać fałszywy trop albo spotkanie twarzą w twarz.",dialogue:"KOKOS: „Mój samochód nie ma poglądów. Ma tylko problem z parkowaniem.”",choices:[["A","Zgłosić uszkodzenie i pójść do szkoły",{rep:2,form:1,car:-5},"Formalności są nudne, ale przydatne.","schooloffice"],["B","Zadzwonić do domu i opowiedzieć wszystko",{rep:1,form:2,car:-5},"Kokos przyznaje, że to nie był normalny poranek.","homecall"]]},
schooloffice:{chapter:"Rozdział 2 · Gabinet dyrektora",title:"Pytania, na które nie ma mema",art:"🏫📋",story:"W gabinecie dyrektora siedzi NET, nauczyciel dyżurny i świadkowie. Dyrektor chce wiedzieć, dlaczego parking zamienił się w internetową sensację. Kokos opowiada swoją wersję bez dopisywania bohaterskich scen. Dyrektor zapowiada rozmowy ze świadkami i przypomina, że szkoła nie będzie tolerować gróźb ani bójek.",dialogue:"NET: „Mówiłem, żebyś nie robił z tego serialu.” KOKOS: „Nie mam nawet budżetu na drugi sezon.”",choices:[["A","Pomóc ustalić, kto widział zdarzenie",{rep:3,form:1,car:0},"Kokos pomaga wyjaśnić sprawę.","classday"],["B","Poprosić o chwilę przerwy i zadzwonić do bliskiej osoby",{rep:2,form:2,car:0},"Czasem trzeba złapać oddech.","homecall"]]},
homecall:{chapter:"Rozdział 2 · Telefon do domu",title:"Dzisiaj bez kolejnych bohaterstw",art:"📞🏠",story:"Kokos dzwoni do bliskiej osoby i mówi wprost, że na parkingu doszło do awantury. Ktoś przyjeżdża po niego, a NET obiecuje przekazać szkole, co widział. Koledzy chcą, żeby opowiedział wszystko na żywo, ale Kokos po raz pierwszy tego ranka odkłada telefon.",dialogue:"NET: „Dobrze zrobiłeś. Nie musisz sam ogarniać całego kibicowskiego internetu.”",choices:[["A","Wrócić później i pomóc wyjaśnić fakty",{rep:2,form:2,car:0},"Kokos nie zostawia sprawy na etapie plotek.","classday"],["B","Wyłączyć powiadomienia i odpocząć",{rep:1,form:3,car:0},"Koniec porannej transmisji.","endcalm"]]},
groupchat:{chapter:"Rozdział 3 · Grupa klasowa",title:"NET kontra komentarze",art:"💬📱",story:"Kokos kłóci się z obcymi kontami. Ktoś wrzuca jego wypowiedź bez kontekstu, ktoś robi mema, a grupa klasowa eksploduje. NET każe mu przestać odpowiadać. Kokos orientuje się, że nie musi wygrywać każdej internetowej sprzeczki.",dialogue:"NET: „Wyloguj się, zanim zaczniesz kłócić się z botem o parking.”",choices:[["A","Przeprosić za podkręcanie dramy",{rep:1,form:1,car:0},"Można przestać pogarszać sprawę.","classday"],["B","Zostawić telefon NET-owi i iść na lekcję",{rep:2,form:2,car:0},"Czasem brak odpowiedzi to najlepsza odpowiedź.","classday"]]},
classday:{chapter:"Rozdział 3 · Reszta dnia",title:"Pierwszy dzwonek po wielkim przypale",art:"🔔📚",story:"W szkole każdy zna już inną wersję wydarzeń. Jedni twierdzą, że Kokos sprowadził pół ligi, inni, że C-Max sam wezwał posiłki. NET ucina plotki i przypomina, żeby nie udostępniać cudzych nagrań. Dyrektor prosi Kokosa, by po lekcjach pomógł spisać chronologię. Kartkówka z matematyki została przesunięta — jedyny wynik tego poranka, który naprawdę cieszy Kokosa.",dialogue:"KOKOS: „Czyli przynajmniej jedna rzecz dzisiaj wyszła.” NET: „Nie zapeszaj.”",choices:[["A","Pomóc uporządkować fakty",{rep:3,form:1,car:0},"Kokos bierze odpowiedzialność.","endresponsible"],["B","Wyłączyć telefon i wrócić do domu",{rep:2,form:2,car:0},"Dzisiaj wystarczy emocji.","endcalm"]]},
endresponsible:{chapter:"Zakończenie · Ogarnianie chaosu",title:"C-Max, honor i rachunek za lusterko",art:"🧾✅",story:"Kokos wraca pod szkołę, gdzie C-Max stoi krzywo jak zawsze, tylko teraz z uszkodzonym lusterkiem. Zostały krzyki, rozbite ego, nagrania w sieci i rachunek za naprawę. NET nadal twierdzi, że Kokos powinien nauczyć się parkować, a Kokos odpowiada, że następnym razem przyjedzie czołgiem. W internecie już ktoś zapowiada rewanż.",dialogue:"NET: „Następnym razem parkuj prosto.” KOKOS: „Następnym razem jadę autobusem.”",ending:"Kokos wybrał odpowiedzialność zamiast kolejnej rundy chaosu."},
endcalm:{chapter:"Zakończenie · Cisza po burzy",title:"Żadnego spokoju, tylko cliffhanger",art:"🌤️📵",story:"Kokos wycisza telefon, ale spokój trwa jedenaście sekund. NET przesyła mu zdjęcie: ktoś przykleił do bramy szkoły kartkę „C-MAX DERBY — REWANŻ”. Pod spodem narysowano krzywe lusterko. Kokos wzdycha i zaczyna szukać kluczyków. Jutro będzie kolejny rozdział, a Jagiellonia nie zamierza odpuścić.",dialogue:"NET: „Dzisiaj zrobiłeś jedną dobrą rzecz: przestałeś klikać.”",ending:"Cliffhanger — rewanż dopiero nadchodzi."}
};
let state={scene:"start",rep:0,form:72,car:84,steps:0,seen:[]};
const $=id=>document.getElementById(id);
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function render(){
 const s=scenes[state.scene]||scenes.start;
 $("chapter").textContent=s.chapter;$("title").textContent=s.title;
 if(s.photo){$("art").classList.add("photo-art");$("art").innerHTML='<img src="https://commons.wikimedia.org/wiki/Special:FilePath/1st_generation_Ford_C-MAX_front.JPG?width=960" alt="Zdjęcie poglądowe Forda C-Max" loading="lazy">';let credit=document.getElementById("photo-credit");if(!credit){credit=document.createElement("div");credit.id="photo-credit";credit.className="photo-credit";$("art").after(credit)}credit.innerHTML='Zdjęcie poglądowe: <a href="https://commons.wikimedia.org/wiki/File:1st_generation_Ford_C-MAX_front.JPG" target="_blank" rel="noopener">Wikimedia Commons</a> · CC0';}
 else{$("art").classList.remove("photo-art");$("art").textContent=s.art;const credit=document.getElementById("photo-credit");if(credit)credit.remove();}
 $("story").textContent=s.story;$("dialogue").textContent=s.dialogue;
 $("rep").textContent=state.rep;$("form").textContent=state.form;$("car").textContent=state.car+"%";
 $("progress").textContent="SCENA "+Math.max(1,state.steps+1);
 $("choices").innerHTML="";
 if(s.ending){const box=document.createElement("div");box.className="ending";const h=document.createElement("h3");h.textContent="TWOJE ZAKOŃCZENIE";const p=document.createElement("p");p.textContent=s.ending;box.append(h,p);$("choices").append(box)}
 s.choices.forEach((c,i)=>{
  const b=document.createElement("button");b.className="choice";
  const num=document.createElement("span");num.className="choice-num";num.textContent=c[0];
  const copy=document.createElement("span");copy.className="choice-copy";copy.textContent=c[1];
  if(c[2]&&c[2].rep!==undefined){const small=document.createElement("small");const bits=[];if(c[2].rep)bits.push("reputacja "+(c[2].rep>0?"+":"")+c[2].rep);if(c[2].form)bits.push("forma "+(c[2].form>0?"+":"")+c[2].form);if(c[2].car)bits.push("C‑Max "+(c[2].car>0?"+":"")+c[2].car);small.textContent=bits.join(" · ");copy.append(small)}
  b.append(num,copy);b.addEventListener("click",()=>choose(c));$("choices").append(b);
 });
}
function choose(c){
 if(c[4]==="restart"){reset();return}
 const delta=c[3]||{};state.rep+=delta.rep||0;state.form=clamp(state.form+(delta.form||0),0,100);state.car=clamp(state.car+(delta.car||0),0,100);
 state.steps++;state.seen.push(state.scene);let next=c[4];if(next==="ending" && (state.form<60 || state.car<55 || state.rep<2)) next="endchaos";state.scene=next;render();window.scrollTo({top:0,behavior:"smooth"});
}
function reset(){state={scene:"start",rep:0,form:72,car:84,steps:0,seen:[]};$("intro").style.display="none";render();window.scrollTo(0,0)}
$("start").addEventListener("click",reset);$("restart").addEventListener("click",()=>{$("intro").style.display="flex";state={scene:"start",rep:0,form:72,car:84,steps:0,seen:[]};render()});
render();
</script>
