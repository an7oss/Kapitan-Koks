<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0e">
<title>KRECHA Z KOKSEM</title>
<style>
:root{color-scheme:dark;--bg:#090a0e;--line:#303541;--lime:#d8ff43}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#222733,#090a0e 68%);color:#f6f7fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(760px,100%);min-height:100vh;margin:auto;padding:22px 16px 28px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:5px 0 16px}
.brand{font-size:.8rem;letter-spacing:.14em;font-weight:950}
.brand span{color:var(--lime)}
.pill{border:1px solid #414755;border-radius:999px;padding:6px 10px;color:#bdc2ce;font-size:.7rem}
.intro{margin:auto 0;padding:56px 0 80px}
h1{font-size:clamp(2.6rem,10vw,5.5rem);line-height:.86;letter-spacing:-.075em;margin:0 0 20px;font-weight:1000}
h1 span{display:block;color:var(--lime)}
.sub{color:#b6bbc5;line-height:1.6;max-width:520px;margin:0}
footer{margin-top:auto;padding-top:18px;color:#5e6572;font-size:.65rem;letter-spacing:.1em;display:flex;justify-content:space-between;gap:12px}
</style>
</head>
<body>
<main>
<header><div class="brand">KOKOS<span>®</span> / NOWA GRA</div><div class="pill">DEMO 01</div></header>
<section class="intro">
<h1>KRECHA <span>Z KOKSEM</span></h1>
<p class="sub">Nowa zawartość w przygotowaniu.</p>
</section>
<footer><span>KRECHA Z KOKSEM</span><span>RUN #001</span></footer>
</main>
</body>
</html>
