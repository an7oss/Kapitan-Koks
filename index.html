<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#14161a;--line:#30343b;--text:#f5f5f0;--muted:#a7abb3;--lime:#d6ff46;--orange:#ff9b54}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
#app{min-height:100svh;background:radial-gradient(ellipse at 50% 0%,#1b2024 0,#08090b 62%);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);display:flex;justify-content:center}

#intro .primary:active{transform:scale(.97);box-shadow:0 0 8px rgba(255,255,255,.8),0 0 20px rgba(110,210,255,.7),inset 0 2px 2px rgba(255,255,255,.9)}
.kicker{letter-spacing:.28em;text-transform:uppercase;color:var(--lime);font-size:.68rem;font-weight:800}
.logo{font-size:clamp(2.1rem,9vw,5rem);line-height:.94;font-weight:1000;letter-spacing:-.065em;margin:18px 0 12px;text-wrap:balance}
.logo span{display:block;color:var(--lime)}
.subtitle{color:#aaa;font-size:.9rem;max-width:340px;line-height:1.6}
.primary{margin-top:28px;border:0;border-radius:14px;background:var(--lime);color:#111;font-weight:950;padding:16px 25px;min-width:190px;box-shadow:0 7px 0 #8ea72d;cursor:pointer}

header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 12px;border-bottom:1px solid var(--line);gap:12px}
.brand{font-size:.83rem;font-weight:1000;letter-spacing:.08em}.brand b{color:var(--lime)}
.small-button{background:#191b20;border:1px solid var(--line);color:#ddd;border-radius:10px;padding:8px 11px;font-size:.75rem;cursor:pointer}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0}
.stat{background:#111317;border:1px solid #24272d;border-radius:12px;padding:10px 12px}.stat-label{font-size:.62rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.stat-value{font-size:1.12rem;font-weight:900;margin-top:2px}
.chapter{display:flex;align-items:center;gap:9px;margin:12px 0 6px;color:var(--lime);font-size:.7rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.chapter:before{content:"";width:22px;height:2px;background:var(--lime)}
.scene-title{font-size:clamp(1.7rem,6vw,2.65rem);line-height:1.04;letter-spacing:-.045em;margin:8px 0 14px;font-weight:950}
.art{min-height:138px;border-radius:18px;border:1px solid #2a2d33;background:linear-gradient(135deg,#20262a,#101114 70%);display:flex;align-items:center;justify-content:center;font-size:4.6rem;position:relative;overflow:hidden;margin:8px 0 18px}
.art:after{content:"";position:absolute;inset:auto -20px -65px;height:110px;background:var(--lime);opacity:.08;transform:rotate(-8deg)}
.art.photo-art{display:block;min-height:0;height:auto;padding:0;background:#111}
.art.photo-art:after{display:none}.art.photo-art img{display:block;width:100%;height:auto;max-height:310px;object-fit:cover}
.photo-credit{font-size:.66rem;color:#8f949b;margin:-10px 0 18px}.photo-credit a{color:var(--lime)}
.story{font-size:1rem;line-height:1.75;color:#e1e2df;white-space:pre-line}.story strong{color:var(--lime)}
.dialogue{border-left:3px solid var(--orange);background:#191719;padding:13px 15px;margin:16px 0;border-radius:0 12px 12px 0;color:#f5d5bf;font-size:.93rem;line-height:1.6}
.choices{display:grid;gap:10px;margin:20px 0 28px}.choice{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:15px 14px;border:1px solid #30343a;border-radius:14px;background:#15171b;color:var(--text);cursor:pointer;transition:border-color .15s,transform .15s}.choice:hover{border-color:var(--lime)}.choice:active{transform:scale(.99)}.choice-num{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:8px;background:#292d30;color:var(--lime);font-size:.76rem;font-weight:900}.choice-copy{font-size:.9rem;line-height:1.45}.choice-copy small{display:block;color:var(--muted);margin-top:4px;font-size:.75rem}
footer{margin-top:auto;padding:18px 0 22px;color:#656970;font-size:.68rem;display:flex;justify-content:space-between;border-top:1px solid #22252a;gap:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--lime);color:#111;font-weight:850;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;z-index:20}#toast.show{opacity:1;transform:translate(-50%,0)}
.ending{border:1px solid #41472b;background:linear-gradient(145deg,#1c2113,#12140f);border-radius:18px;padding:18px;margin:18px 0}.ending h3{color:var(--lime);margin:0 0 8px}
@media(min-width:650px){#app{padding-left:28px;padding-right:28px}.art{min-height:190px;font-size:5.5rem}.story{font-size:1.05rem}}

<script>
const scenes = {
toilet1030:{chapter:"Motyw powracający · 10:30",title:"10:30. Wiadomo, co to oznacza.",art:"🚻",story:"Równo 10:30. Kokos patrzy na zegarek, wstaje bez słowa i rusza w stronę szkolnej toalety. RUDA DUPA po sekundzie robi dokładnie to samo. Cała klasa milknie. Toni szepcze: „Znowu ten ich tajemniczy punkt programu”.\n\nDrzwi się zamykają. Po chwili słychać głośne: „NIE DOTYKAJ TEGO, TO DO BIOLOGII!” oraz huk przewracanej szczotki. Woźny puka w drzwi i pyta, czy ma wezwać dyrektora, hydraulika, czy egzorcystę. Gdy obaj wychodzą, Kokos ma przekrzywiony kołnierz, RUDA DUPA trzyma rolkę papieru jak trofeum, a nikt nie chce znać szczegółów.",dialogue:"TANI: „Nie pytam. Nie chcę wiedzieć. Ale od jutra przerwa o 10:30 jest monitorowana przez komisję.” KOKOS: „To naruszenie praw człowieka.” RUDA DUPA: „I praw hydrauliki.”",choices:[["A","Wrócić na lekcję i zachowywać się, jakby nic się nie stało","Cała klasa i tak już zrobiła z tego legendę.",{rep:1,form:0},"hall"],["B","Wymyślić z Rudą Dupą absurdalne oficjalne oświadczenie","„Badaliśmy akustykę kafelków”. Nikt nie kupuje tej wersji.",{rep:2,form:0},"clubmeeting"],["C","Zacząć się śmiać i nie dokładać nikomu prywatnych plotek","Żart żartem, ale nie rób z tego nagonki.",{rep:2,form:1},"fc27"]]},

start:{chapter:"Rozdział 1 · Parking szkolny",title:"7:40. Jagiellonia na parkingu",art:"🚙⚽",story:"Godzina 7:40. Kokos wjeżdża swoim Fordem C-Maxem na szkolny parking. Parkuje między dwoma autami tak krzywo, że kamera cofania chyba składa wypowiedzenie. Kokos gasi silnik, poprawia plecak i już ma ruszyć do wejścia, kiedy drogę zastępuje mu grupka huliganów Jagiellonii w klubowych barwach.\n\nJeden z nich klepie w dach C-Maxa i rzuca: „No proszę, kibic Legii pod samą szkołą. Zaraz cię nauczymy parkować i kibicować”. Reszta podchodzi bliżej. Atmosfera robi się napięta, a Kokos widzi, że musi szybko zdecydować, co robić.",dialogue:"KOKOS: „Panowie, to jest rodzinny minivan, nie czołg. Możemy rozwiązać to bez demolowania parkingu?” HULIGAN: „Masz trzy sekundy na lepszy pomysł.”",choices:[["A","Poprosić o pomoc Legię",{rep:2,form:0,car:0},"Kokos wybiera telefon zamiast samotnej bójki.","legiahelp"],["B","Wdać się z nimi w awanturę",{rep:1,form:-8,car:-5},"Parking zamienia się w krzykliwy teatr absurdu.","parkingfight"],["C","Oddać barwy, żeby spróbować zakończyć sprawę",{rep:-2,form:-18,car:0},"Upokarzająca decyzja nie gwarantuje, że go zostawią w spokoju.","colors"]]},
legiahelp:{chapter:"Rozdział 1 · Kibicowski crossover",title:"Legia, Teddy Boys 95 i Zagłębie wchodzą na parking",art:"🟢⚪🔴🚩",story:"Kokos dzwoni po pomoc. Kilka minut później na parking pod szkołą podjeżdża Legia, a z nią Teddy Boys 95 i ekipa kibiców Zagłębia Sosnowiec. Zwykły szkolny poranek zmienia się w absurdalny kibicowski zlot. Jagiellonia widzi, że sytuacja robi się napięta. Lecą okrzyki, wzajemne docinki i pyskówki, a przewrócone pachołki toczą się po parkingu jak w tanim filmie akcji. Nauczyciel dyżurny natychmiast wzywa pomoc. Po krótkiej, chaotycznej konfrontacji Jagiellonia wycofuje się, a Legia ogłasza zwycięstwo bez pokazywania brutalnych scen.",dialogue:"KOKOS: „Ja prosiłem o pomoc, nie o zlot wszystkich kibicowskich frakcji w promieniu stu kilometrów!” TANI przez telefon: „Ile flag?” KOKOS: „Nie wiem, jeszcze liczą!”",choices:[["A","Zobaczyć, co się stało z flagami",{rep:3,form:0},"Ekipa Legii twierdzi, że zdobyła 58 flag Jagiellonii. Co teraz?","flags"],["B","Zabrać C-Maxa i ewakuować się, zanim przyjedzie policja",{rep:1,form:2},"Kokos uznaje, że jego udział w historii już wystarczy.","hall"]]},flags:{chapter:"Rozdział 1 · 58 flag",title:"58 flag i dymny przypał",art:"🚩💨",story:"Po wszystkim Legia chwali się zdobyciem 58 flag Jagiellonii. Ktoś proponuje je spalić, ale nauczyciel i ochroniarz przerywają ten pomysł, zanim parking zmieni się w pożarowy raport. Flagi zostają zabezpieczone, a nagrania momentalnie trafiają do internetu. Dyrekcja jest wściekła, policja przyjeżdża na miejsce, a Kokos patrzy na telefon: jego poranek właśnie stał się ogólnopolskim przypałem. Zwycięstwo Legii jest głośne, ale konsekwencje dopiero nadchodzą.",dialogue:"KOKOS: „58 flag? Ja nawet nie mam 58 złotych na paliwo.” RUDA DUPA: „Gratulacje. Zrobiłeś z parkingu szkoły najgorszy stadion w kraju.”",choices:[["A","Wrócić do szkoły i powiedzieć prawdę",{rep:1,form:1},"Koniec kibicowskiego widowiska, czas na konsekwencje.","hall"],["B","Zniknąć z kadru i sprawdzić, czy C-Max nadal ma lusterka",{rep:0,form:2},"Kokos wraca do swoich priorytetów motoryzacyjnych.","parking"]]},parkingfight:{chapter:"Rozdział 1 · Parking szkolny",title:"Awantura przed pierwszym dzwonkiem",art:"🗯️🚙",story:"Kokos odpowiada im równie głośno. Przez pół minuty wszyscy przekrzykują się jak uczestnicy debaty, w której nikt nie zna tematu. Ktoś szarpie plecak, ktoś potrąca lusterko C-Maxa, a nauczyciel dyżurny rusza biegiem przez parking. Zanim sytuacja przeradza się w większą bójkę, grupa się rozprasza. Kokos zostaje z rozwalonym planem poranka i lusterkiem ustawionym pod kątem filozoficznym.",dialogue:"NAUCZYCIEL: „Czy ja mogę chociaż raz zacząć dzień od sprawdzania obecności?!”",choices:[["A","Pójść z nauczycielem zgłosić napaść",{rep:1,form:-2,car:-5},"Najpierw bezpieczeństwo, potem naprawa lusterka.","hall"],["B","Sprawdzić C-Maxa i zadzwonić po zaufaną osobę",{rep:0,form:1,car:-8},"Kokos odkrywa nową funkcję auta: generator przypału.","parking"]]},colors:{chapter:"Rozdział 1 · Najgorszy deal",title:"Barwy oddane, problem został",art:"🧣😬",story:"Kokos oddaje szalik, licząc, że to zakończy sprawę. Huligani zabierają go, ale i tak go popychają i przewracają na asfalt. Scena kończy się szybko, gdy woźny i nauczyciel dyżurny ruszają z pomocą, a napastnicy uciekają. Bez krwawych szczegółów: boli go ramię, ubranie jest brudne, a poranek właśnie wskoczył na pierwsze miejsce rankingu najgorszych.",dialogue:"WOŹNY: „Do pielęgniarki, młody. A potem zgłaszamy to dyrekcji. To nie jest żaden mecz.”",choices:[["A","Przyjąć pomoc i zgłosić napad",{rep:0,form:-5,car:0},"Nie musi udawać, że nic się nie stało.","hall"],["B","Zadzwonić do kogoś zaufanego, żeby po niego przyszedł",{rep:1,form:-3,car:0},"Dzisiaj najważniejsze jest bezpiecznie dotrzeć do środka.","hall"]]},parking:{chapter:"Rozdział 1 · Pierwszy przypał",title:"C-Max i tajemniczy dymek",art:"🚙",story:"Kokos próbuje zaparkować z powagą kierowcy rajdowego, ale auto stoi krzywo, a z telefonu leci głosówka od Toniego: „Nie pytaj, co było na imprezie”. Kokos patrzy w kamerę cofania i widzi własną twarz człowieka, który właśnie zrozumiał, że nie powinien był mówić „mam plan”.",dialogue:"RUDA DUPA: „Auto prosi, żebyś nie wciągał go w swoje afery.”",choices:[["A","Zostawić samochód i wejść do szkoły bez kolejnego popisu","Minimalny rozsądek, maksimum zaskoczenia.",{rep:2,form:1},"hall"],["B","Nagrywać filmik wyjaśniający, zanim pozna fakty","Kokos publikuje oświadczenie do sprawy, której nie rozumie.",{rep:-1,form:-1},"hall"]]},
music:{chapter:"Rozdział 1 · Internet płonie",title:"Głosówka, której nie da się odzobaczyć",art:"🎙️",story:"Kokos przez pomyłkę wysyła na grupę klubu 38-sekundową głosówkę, w której przez większość czasu słychać szuranie, niezrozumiałe mamrotanie i jego triumfalne: „wszystko jest pod kontrolą”. Grupa odpowiada jednym pytaniem: „CO jest pod kontrolą?”.",dialogue:"KOKOS: „To był eksperyment artystyczny.” TANI: „To był dowód rzeczowy.”",choices:[["A","Przeprosić i przestać udawać, że to był performance","Sztuka współczesna odwołana.",{rep:2,form:1},"hall"],["B","Dorzucić kolejną głosówkę z wyjaśnieniem","Sequel jest gorszy od oryginału.",{rep:-1,form:-1},"hall"]]},
help:{chapter:"Rozdział 1 · Nieoczekiwany świadek",title:"Ruda Dupa zna prawdę",art:"🕵️",story:"Ruda Dupa pokazuje Kokosowi listę obietnic, których ten nie dotrzymał: turniej, trening, zebranie, oddanie pożyczonych pieniędzy i przeprosiny. Lista ma własną numerację stron. Kokos pyta, czy może ją spalić. Ruda Dupa odpowiada, że najpierw musi ją podpisać.",dialogue:"RUDA DUPA: „To nie hejt. To dokumentacja.”",choices:[["A","Przyznać się do zaległości i zacząć od najpilniejszej","Rozwój postaci w toku.",{rep:3,form:2},"hall"],["B","Próbować negocjować z listą","Lista nie przyjmuje łapówek w kebabach.",{rep:-1,form:0},"hall"]]},
hall:{chapter:"Rozdział 2 · Afera na czacie",title:"Screeny, ploty i totalna kompromitacja",art:"📱",story:"Klasowa grupa zamieniła się w sąd, newsroom i cyrk jednocześnie. Ktoś twierdzi, że Kokos imprezował do rana, ktoś inny dopisał historię o „tajemniczym krysztale”, a trzeci wrzucił zdjęcie miski z cukrem jako rzekomy dowód. Kokos nie pamięta połowy rozmów, ale wie, że plotki zaczynają krzywdzić ludzi, a nie tylko robić memy.",dialogue:"TANI: „Jeśli jeszcze raz napiszesz ‘XD’ zamiast wyjaśnić sprawę, wyrzucę cię z zarządu.” KOKOS: „To cenzura śmiechu.”",choices:[["A","Wyjaśnić, co jest plotką, a co faktycznie się wydarzyło","Prawda bywa mniej efektowna niż screeny.",{rep:3,form:1},"partyhelp"],["B","Przestać rozsyłać screeny i pogadać z osobami, których dotyczy afera","Nie dokładaj paliwa do pożaru.",{rep:2,form:2},"partyhelp"],["C","Odpisać wszystkim caps lockiem i jeszcze bardziej nakręcić dramę","Kokos kontra klawiatura: nikt nie wygrywa.",{rep:-3,form:-2},"partycover"],["10:30","Zniknąć na przerwę z Rudą Dupą","Klasa już zna ten podejrzanie punktualny harmonogram.",{rep:1,form:0},"toilet1030"]]},
firstyears:{chapter:"Rozdział 2 · Plot twist",title:"Kokos kontra własna reputacja",art:"🧨",story:"Na przerwie Kokos odkrywa, że ktoś zrobił profil „KokosNews”, który publikuje każdą jego wpadkę szybciej niż lokalny portal. Najnowszy wpis brzmi: „Kokos miał ogarnąć turniej, ale zgubił regulamin, salę i samego siebie”. Niestety, tym razem wpis jest prawie zgodny z prawdą.",dialogue:"RUDA DUPA: „Masz talent do robienia z prostych spraw sezonu serialu.” KOKOS: „Gdzie negocjuję prawa do ekranizacji?”",choices:[["A","Przyznać, że zawalił organizację i zacząć naprawiać szkody","Rzadki moment rozwoju postaci.",{rep:3,form:2},"clubmeeting"],["B","Próbować znaleźć autora profilu zamiast ogarnąć problem","Detektyw Kokos rozwiązuje sprawę, której nikt nie zlecał.",{rep:-1,form:-1},"party"],["C","Zrobić z tego mema, ale bez ujawniania cudzych prywatnych spraw","Przynajmniej tym razem nie pogarsza sytuacji.",{rep:1,form:1},"fc27"]]},
training:{chapter:"Rozdział 3 · Trening",title:"Piłka nie kłamie",art:"🧤",story:"Trener stawia Kokosa w bramce. Pierwszy strzał leci w środek. Drugi w okienko. Trzeci… to podanie do kolegi, który zapomniał, po której stronie gra. Kokos musi zdecydować, jak potraktować tę kompromitację.",dialogue:"TRENER: „Kokos, refleks masz. Teraz jeszcze naucz się przewidywać.” KOKOS: „Przewiduję, że będzie ciężko.”",choices:[["A","Skupić się na ustawieniu i obserwować strzelca","Forma rośnie dzięki pracy.",{rep:1,form:4},"clubmeeting"],["B","Rzucić się do każdej piłki, nawet tej poza boiskiem","Spektakularnie, ale kolana protestują.",{rep:2,form:-3},"clubmeeting"],["10:30","Zniknąć na szkolną przerwę z Rudą Dupą","Trener patrzy na zegarek i wzdycha.",{rep:1,form:0},"toilet1030"],["C","Poprosić obrońców, żeby lepiej komunikowali się z bramkarzem","Drużyna to nie jednoosobowy teatr.",{rep:3,form:2},"clubmeeting"]]},
cartrouble:{chapter:"Rozdział 4 · Po lekcjach",title:"Kontrolka grozy",art:"🛠️",photo:true,story:"Po lekcjach Kokos przekręca kluczyk. C‑Max odpowiada pojedynczym „klik”. Na desce rozdzielczej świeci się kontrolka, której Kokos nie widział nigdy, a instrukcja obsługi ma grubość cegły.",dialogue:"RUDA DUPA: „Może to znak, żeby iść pieszo.” KOKOS: „Nie mów tak przy samochodzie. On rozumie.”",choices:[["A","Zadzwonić do rodzica i poprosić o pomoc","Rozsądek jest szybszy niż laweta.",{rep:1,car:5},"campplan"],["B","Zajrzeć do instrukcji i sprawdzić, co oznacza kontrolka","Nauka. W czwartej klasie. Sensacja.",{rep:2,car:3},"campplan"],["C","Spróbować odpalić jeszcze raz, bez szarpania i kombinowania","C‑Max w końcu mruczy.",{rep:0,car:-4},"campplan"]]},
mystery:{chapter:"Rozdział 5 · Tajemnica bagażnika",title:"Co jest w środku?",art:"🧳",story:"Kiedy Kokos otwiera bagażnik, znajduje trzy rzeczy: starą rękawicę bramkarską, paragon z kebaba sprzed siedmiu miesięcy i kopertę z napisem „OTWORZYĆ PO WYGRANIU”. Kokos nigdy nie widział tej koperty. Ruda Dupa twierdzi, że to początek kryminału.",dialogue:"KOKOS: „Może to testament?” RUDA DUPA: „Masz osiemnaście lat i trzy złote w schowku.”",choices:[["A","Otworzyć kopertę od razu","Ciekawość wygrywa.",{rep:1,form:0},"envelope"],["B","Zostawić ją do końca meczu","Dramaturgia przede wszystkim.",{rep:2,form:1},"match"]]},
envelope:{chapter:"Rozdział 5 · Tajemnica bagażnika",title:"Wiadomość od samego siebie",art:"✉️",story:"W kopercie znajduje się kartka napisana własnym pismem Kokosa: „Jeśli to czytasz, to znaczy, że znów zapomniałeś, gdzie schowałeś zapasowe rękawice. Są w torbie sportowej.” Na odwrocie jest dopisek: „I kup płyn do spryskiwaczy, geniuszu.”",dialogue:"RUDA DUPA: „To najbardziej przyziemna tajemnica w historii.” KOKOS: „Ale rozwiązana.”",choices:[["A","Kupić płyn i ogarnąć torbę","Małe rzeczy też budują legendę.",{rep:2,car:2},"match"],["B","Schować kartkę do portfela na przyszłość","Kokos właśnie stworzył własny system pamięci.",{rep:1,form:1},"match"]]},
match:{chapter:"Rozdział 6 · Wielki mecz",title:"Jeden strzał",art:"🏟️",story:"Finał szkolnego turnieju. Wynik 1:1. Została minuta. Kokos poprawia rękawice i słyszy z trybun swoje imię, wymieszane z okrzykiem „C‑MAX!”. Nikt nie wie dlaczego. Napastnik przeciwników ustawia piłkę.",dialogue:"TRENER: „Nie musisz być bohaterem. Masz po prostu zrobić swoje.”",choices:[["A","Skupić się na biodrach strzelca i nie zgadywać za wcześnie","Technika zamiast teatru.",{rep:2,form:3},"save"],["B","Zrobić mały krok do przodu i skrócić kąt","Odważnie, ale z głową.",{rep:2,form:2},"save"],["C","Krzyknąć „C‑MAX NIE PĘKA!”","Trybuny odpowiadają. Strzelec też się śmieje.",{rep:3,form:0},"save"]]},
save:{chapter:"Rozdział 6 · Wielki mecz",title:"Decydująca obrona",art:"🧤",story:"Strzał! Przez ułamek sekundy wszystko zwalnia. Kokos rusza w stronę piłki. Niezależnie od wyniku, to moment, na który trenował cały sezon.",dialogue:"KOKOS (w myślach): „Piłka. Ręce. Spokój. I nie myśl o kontrolce silnika.”",choices:[["A","Rzucić się zdecydowanie w wybrany róg","Jeśli forma jest wysoka, masz przewagę.",{rep:3,form:1},"ending"],["B","Zostać chwilę dłużej na nogach i reagować","Czytanie gry bywa lepsze niż zgadywanie.",{rep:2,form:2},"ending"]]},
ending:{chapter:"Epilog · Legenda osiedla",title:"I co dalej, Kokosie?",art:"🌇",story:"Mecz się kończy. Drużyna biegnie do Kokosa. Ruda Dupa robi zdjęcie, na którym wszyscy mają zamknięte oczy. C‑Max odpala za pierwszym razem — co uznano za drugi cud tego dnia. Kokos patrzy na boisko i pierwszy raz nie musi nikomu niczego udowadniać.",dialogue:"KOKOS: „Dobra. Jutro trening. A potem ogarniam tę kontrolkę.”",choices:[["A","Zakończyć dzień jak człowiek i wrócić do domu","Najlepsze legendy zaczynają się od rozsądku.",{rep:2,form:2},"endgood"],["B","Zaproponować drużynie dodatkowy trening","Kapitan to nie tylko opaska.",{rep:3,form:1},"endcaptain"],["C","Zrobić z C‑Maxa oficjalną maskotkę zespołu","Nie pytajcie o zgodę działu marketingu.",{rep:4,form:0},"endcar"]]},

autism:{chapter:"Rozdział 3 · Zjazd formy",title:"Kokos i konsekwencje",art:"🌀",story:"Po kilku nieprzespanych nocach i chaotycznych decyzjach Kokos nie może się skupić. Nie ma w tym żadnej magicznej supermocy ani „imprezowej legendy” — jest zmęczenie, spóźnienia i ludzie, którym obiecał pomoc. Ruda Dupa mówi wprost, że Kokos nie musi udawać, że wszystko jest git.",dialogue:"RUDA DUPA: „Nie musisz być najgłośniejszym typem w pokoju. Wystarczy, że przestaniesz robić pięć katastrof dziennie.”",choices:[["A","Odwołać zbędne plany, odpocząć i naprawić to, co zawalił","Niespodziewanie rozsądny wybór.",{rep:2,form:4},"glasses"],["B","Poprosić zaufaną osobę o pomoc w ogarnięciu spraw","Samodzielność nie oznacza robienia wszystkiego samemu.",{rep:3,form:3},"glasses"],["C","Udawać, że nic się nie dzieje i brać na siebie kolejne zadania","Kokos właśnie zamówił dodatkową katastrofę.",{rep:-2,form:-4},"anger"]]},
glasses:{chapter:"Rozdział 3 · Wielki comeback",title:"Lista rzeczy, których Kokos nie zgubi",art:"🧾",story:"Kokos robi listę: telefon, klucze, rękawice, regulamin, godność. Przy ostatnim punkcie Ruda Dupa pyta, czy ma wpisać „do odzyskania”. Tymczasem Toni wysyła wiadomość: „pilne zebranie, nic się nie stało”. To zdanie w historii klubu zawsze oznacza, że stało się absolutnie wszystko.",dialogue:"KOKOS: „Tym razem będę odpowiedzialny.” RUDA DUPA: „Zrobię screena, żebyśmy mieli dowód historyczny.”",choices:[["A","Pójść na zebranie z konkretnym planem naprawczym","Może tym razem będzie mniej pożarów.",{rep:3,form:2},"clubmeeting"],["B","Wysłać samą emotkę ognia i nie przyjść","Komunikacja w stylu alarmu przeciwpożarowego.",{rep:-2,form:-1},"clubmeeting"],["C","Poprosić Rudej Dupy, żeby przypomniał mu o najważniejszych sprawach","System wsparcia zamiast kolejnej katastrofy.",{rep:2,form:2},"clubmeeting"]]},
study:{chapter:"Rozdział 4 · Wzorowy uczeń",title:"Kartkówka z życia",art:"📚",story:"Kokos ma notatki w trzech kolorach, tabelkę powtórek i plan awaryjny na wypadek, gdyby długopis przestał pisać. Nauczyciel prosi, by pomógł koledze zrozumieć zadanie, a nie tylko podał wynik. Kokos musi wybrać między szybkim popisem a cierpliwym tłumaczeniem.",dialogue:"NAUCZYCIEL: „Wiedza ma większą wartość, kiedy umiesz ją wytłumaczyć.”",choices:[["A","Rozłożyć zadanie na małe kroki","Cierpliwość też jest umiejętnością.",{rep:3,form:1},"training"],["B","Podać sam wynik, bo dzwonek zaraz zadzwoni","Szybko, ale niewiele z tego wynika.",{rep:0,form:0},"training"],["C","Poprosić o chwilę na uporządkowanie myśli","Prośba o chwilę nie jest porażką.",{rep:2,form:2},"training"]]},
clubmeeting:{chapter:"Rozdział 5 · Zarząd klubu",title:"Toni i Tani zwołują zebranie",art:"🏟️",story:"Prezesem klubu jest Toni, a wiceprezesem Tani. Toni chce rozmachu, Tani chce budżetu, a Kokos przynosi segregator z harmonogramem i tabelą ryzyk. Zebranie zaczyna się od pytania, kto zamówił 40 pachołków w kształcie banana.",dialogue:"TONI: „Potrzebujemy wielkiego wydarzenia!” TANI: „Potrzebujemy też wiedzieć, kto za to zapłaci.” KOKOS: „Przygotowałem arkusz.”",choices:[["A","Przedstawić plan z kosztami","Ambicja plus organizacja.",{rep:3,form:2},"campplan"],["B","Zgodzić się na wszystko, byle ruszyć","Entuzjazm nie zastępuje planu.",{rep:1,form:-1},"campplan"],["10:30","Ogłosić przerwę techniczną i ruszyć z Rudą Dupą","Nikt nie pyta, dlaczego zawsze o tej samej porze.",{rep:1,form:0},"toilet1030"],["C","Warknąć, że tylko on wie, jak to zrobić","Agresja zamyka ludziom uszy.",{rep:-3,form:-2},"anger"]]},
campplan:{chapter:"Rozdział 6 · Projekt Kokosa",title:"Turnus piłkarski",art:"⚽",story:"Kokos chce zorganizować turnus piłkarski: treningi bramkarskie, małe gry, odpoczynek, wodę i jasny harmonogram. Toni widzi już finał na stadionie, Tani pyta o opiekunów, zgodę rodziców, dostępność boiska i koszty. Budżet jest napięty, a Toni proponuje „sponsorowane spotkanie integracyjne”, nie umiejąc wyjaśnić, co to oznacza. Kokos czuje, że zaraz zacznie się bałagan.",dialogue:"TANI: „Dobra inicjatywa musi być dobrze przygotowana.” TONI: „I musi mieć plakat!”",choices:[["A","Rozpisać budżet i zasady bezpieczeństwa do zatwierdzenia przez dorosłych","Organizator myśli o wszystkich.",{rep:4,form:2},"cartrouble"],["B","Pójść na spotkanie Toniego i sprawdzić, co naprawdę planuje","Czasem najlepszy ruch to sprawdzić fakty.",{rep:1,form:1},"party"],["C","Zgodzić się na imprezę bez planu, bo „jakoś to będzie”","Słynne ostatnie słowa każdego organizatora.",{rep:-1,form:-1},"party"]]},
fc27:{chapter:"Rozdział 7 · Turniej FC 27",title:"Puchar wirtualnych bramkarzy",art:"🎮",story:"Po zamieszaniu z domówką Kokos wraca do planu turnieju FC 27. Ktoś proponuje, żeby zwycięzca dostał nagrodę, a przegrani „musieli wypić coś mocnego”. Kokos ucina pomysł: turniej ma być dla wszystkich, bez presji, używek i upokarzania kogokolwiek. Teraz trzeba ustalić zasady, które naprawdę będą przestrzegane.",dialogue:"KOKOS: „Przegrana to wynik, nie koniec świata.” RUDA DUPA: „Powiedz to mojemu kontrolerowi.”",choices:[["A","Ustalić jasne zasady i nagrodę fair play","Każdy wie, na co się zgadza.",{rep:3,form:1},"boundaries"],["B","Zrobić wieczór testowy i sprawdzić plan","Najpierw testujemy organizację.",{rep:2,form:2},"boundaries"],["C","Wyśmiać słabszych graczy","To psuje atmosferę.",{rep:-3,form:0},"anger"]]},
boundaries:{chapter:"Rozdział 8 · Szacunek",title:"Granice są ważne",art:"🛑",story:"Na szkolnym korytarzu Kokos chce zaimponować wszystkim autem i opowieściami o piłce. Zatrzymuje się i przypomina sobie, że nikt nie jest publicznością na żądanie. Życzliwość nie daje prawa do czyjejś uwagi, a relacje powinny być wzajemne, dobrowolne i odpowiednie do wieku.",dialogue:"TANI: „Szacunek to też wiedzieć, kiedy nie naciskać.” KOKOS: „Jasne. Nie będę robił z ludzi celu do zdobycia.”",choices:[["A","Przywitać się normalnie i wrócić do organizacji turnieju","Uprzejmość bez presji.",{rep:3,form:1},"anger"],["B","Skupić się na znajomościach z rówieśnikami i wzajemnym zainteresowaniu","Relacje wymagają zgody obu stron.",{rep:2,form:1},"anger"],["C","Popisywać się, by wymusić uwagę","Nikt nie ma obowiązku reagować na popisy.",{rep:-2,form:-1},"anger"]]},
anger:{chapter:"Rozdział 9 · Trudny moment",title:"Czerwona kartka dla złości",art:"🟥",story:"Ktoś przesunął notatki, turniej ma opóźnienie, a na treningu padł głupi komentarz. Kokos czuje, że zaraz wybuchnie. Ma prawo być zły, ale odpowiada za to, jak potraktuje innych.",dialogue:"TRENER: „Masz prawo być wkurzony. Nie masz prawa straszyć ludzi.”",choices:[["A","Poprosić o pięć minut przerwy, a potem spokojnie wyjaśnić problem","Kontrola to umiejętność, którą da się ćwiczyć.",{rep:3,form:3},"mystery"],["B","Powiedzieć wprost, co było nie w porządku, bez wyzwisk","Stanowczość bez agresji.",{rep:2,form:1},"mystery"],["C","Krzyczeć i rozwalić zebranie","Złość mija, konsekwencje zostają.",{rep:-4,form:-3},"mystery"]]},
party:{chapter:"Rozdział 7 · Domówka widmo",title:"Domówka, która spierdala z torów",art:"🥴",story:"Toni zapowiadał kameralne spotkanie. O 23:17 ktoś rozlał lepki napój na konsolę, głośnik gra tylko basem, a na kanapie siedzi typ w jednym bucie i kłóci się z lampą. Na stole leży podejrzany proszek, którego nikt nie chce uznać za swój. Nagle gaśnie światło. Ktoś wrzeszczy POLICJA, choć to tylko sąsiad napierdala w kaloryfer. W zamieszaniu ktoś zgarnia kurtkę Toniego, ktoś inny próbuje wyjechać C-MAXem, a Kokos odkrywa, że jego telefon nadaje na żywo od jedenastu minut.",dialogue:"RUDA DUPA: To nie impreza, to audyt ludzkich błędów. TONI: KTO MI ZAJUMAL KURTKĘ?! KOKOS: Dobra, kurwa, nikt nie dotyka auta, a ty przestań się kłócić z meblem.",choices:[["A","Zgasić live'a i zebrać ekipę do kupy","Na ekranie zostaje 900 widzów i komentarz: bracie, co to za cyrk.",{rep:2,form:1},"partyhelp"],["B","Wyjść z Rudą Dupą na klatkę i znaleźć złodzieja kurtki","Po drodze odkrywacie trzy cudze buty, kebaba w doniczce i Toniego negocjującego z domofonem.",{rep:2,form:2},"partycover"],["C","Ruszyć za typem, który zabrał kluczyki do C-MAXa","Kończy się alarmem, mokrym trawnikiem i awanturą na całe osiedle.",{rep:-1,form:-1},"partycover"]]},
partyhelp:{chapter:"Rozdział 7 · Dzień po katastrofie",title:"Kac moralny i 46 wiadomości",art:"📱",story:"Rano salon wygląda jak miejsce zbrodni po ataku kebabów. Toni siedzi w skarpetkach nie do pary, Ruda Dupa ogląda nagranie, na którym Kokos przez cztery minuty kłóci się z automatem do przekąsek, a czat klasowy ma już siedem teorii i jeden fatalny remix. Ktoś z imprezy źle się poczuł i trafił pod opiekę ratowników, więc ekipa musi powiedzieć, co faktycznie widziała — bez zmyślania i bez robienia z czyjegoś stanu mema. Potem zaczyna się druga katastrofa: rodzice, właściciel mieszkania i wiadomość od trenera: ZEBRANIE. NATYCHMIAST.",dialogue:"RUDA DUPA: Kokos, jesteś jedynym człowiekiem, który dostał bana od automatu z chipsami. KOKOS: On zaczął. TONI: Ktoś niech mi powie, że przynajmniej kurtka wróciła.",choices:[["A","Pójść na zebranie i przyznać, co odwaliła ekipa","Dostajecie opierdol życia, a klubowe wydarzenia lecą na pauzę.",{rep:3,form:1},"mystery"],["B","Odzyskać kurtkę i ustalić, kto wrzucił kompromitujący live","Detektywi ruszają tropem brokatu, sosu czosnkowego i fatalnych decyzji.",{rep:2,form:2},"fc27"]]},
partycover:{chapter:"Rozdział 7 · Poranek po",title:"C-MAX, sąsiedzi i internetowy lincz",art:"🚨",story:"Na parkingu alarm C-MAXa wyje jakby auto właśnie odkryło sens życia i go znienawidziło. Typ z kluczykami ucieka trzy metry, ślizga się na trawie i wpada w krzaki. Toni próbuje odzyskać kurtkę, ale przypadkiem wraca w cudzym płaszczu z cekinami. Z balkonów lecą komentarze, ktoś nagrywa wszystko w pionie, a sąsiad w kapciach wygłasza przemowę o upadku cywilizacji. W tle dociera wiadomość, że ktoś z imprezy potrzebował pomocy medycznej. Teraz trzeba zmierzyć się z konsekwencjami, zanim szkolny czat przerobi noc na tysiąc kłamliwych memów.",dialogue:"RUDA DUPA: Twoja reputacja właśnie odjechała. Bez ciebie, ale z alarmem. KOKOS: Przynajmniej C-MAX ma zasięgi. TONI: Oddajcie mi, kurwa, moją kurtkę.",choices:[["A","Zebrać fakty i wyprostować największe kłamstwa na czacie","Nie wszyscy uwierzą, ale przynajmniej nie dolewasz benzyny do dramy.",{rep:2,form:1},"partyhelp"],["B","Zrzucić wszystko na Toniego i liczyć, że temat zdechnie","Toni pokazuje screeny. Plan umiera szybciej niż wasza godność.",{rep:-4,form:-2},"endchaos"]]},

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function render(){
 const s=scenes[state.scene]||scenes.start;
 $("chapter").textContent=s.chapter;$("title").textContent=s.title;
 if(s.photo){$("art").classList.add("photo-art");$("art").innerHTML='<img src="https://commons.wikimedia.org/wiki/Special:FilePath/1st_generation_Ford_C-MAX_front.JPG?width=960" alt="Zdjęcie poglądowe Forda C-Max" loading="lazy">';let credit=document.getElementById("photo-credit");if(!credit){credit=document.createElement("div");credit.id="photo-credit";credit.className="photo-credit";$("art").after(credit)}credit.innerHTML='Zdjęcie poglądowe: <a href="https://commons.wikimedia.org/wiki/File:1st_generation_Ford_C-MAX_front.JPG" target="_blank" rel="noopener">Wikimedia Commons</a> · CC0';}
 else{$("art").classList.remove("photo-art");$("art").textContent=s.art;const credit=document.getElementById("photo-credit");if(credit)credit.remove();}
 $("story").textContent=s.story;$("dialogue").textContent=s.dialogue;
 $("rep").textContent=state.rep;$("form").textContent=state.form;$("car").textContent=state.car+"%";
 $("progress").textContent="SCENA "+Math.max(1,state.steps+1);
 $("choices").innerHTML="";
 if(s.ending){const box=document.createElement("div");box.className="ending";const h=document.createElement("h3");h.textContent="TWOJE ZAKOŃCZENIE";const p=document.createElement("p");p.textContent=s.ending;box.append(h,p);$("choices").append(box)}
 s.choices.forEach((c,i)=>{
  const b=document.createElement("button");b.className="choice";
  const num=document.createElement("span");num.className="choice-num";num.textContent=c[0];
  const copy=document.createElement("span");copy.className="choice-copy";copy.textContent=c[1];
  if(c[2]&&c[2].rep!==undefined){const small=document.createElement("small");const bits=[];if(c[2].rep)bits.push("reputacja "+(c[2].rep>0?"+":"")+c[2].rep);if(c[2].form)bits.push("forma "+(c[2].form>0?"+":"")+c[2].form);if(c[2].car)bits.push("C‑Max "+(c[2].car>0?"+":"")+c[2].car);small.textContent=bits.join(" · ");copy.append(small)}
  b.append(num,copy);b.addEventListener("click",()=>choose(c));$("choices").append(b);
 });
}
function choose(c){
 if(c[4]==="restart"){reset();return}
 const delta=c[2]||{};state.rep+=delta.rep||0;state.form=clamp(state.form+(delta.form||0),0,100);state.car=clamp(state.car+(delta.car||0),0,100);
 state.steps++;state.seen.push(state.scene);let next=c[4];if(next==="ending" && (state.form<60 || state.car<55 || state.rep<2)) next="endchaos";state.scene=next;render();window.scrollTo({top:0,behavior:"smooth"});
}
function reset(){state={scene:"start",rep:0,form:72,car:84,steps:0,seen:[]};$("intro").style.display="none";render();window.scrollTo(0,0)}
$("start").addEventListener("click",reset);$("restart").addEventListener("click",()=>{$("intro").style.display="flex";state={scene:"start",rep:0,form:72,car:84,steps:0,seen:[]};render()});
render();
</script>
</body>
</html>
